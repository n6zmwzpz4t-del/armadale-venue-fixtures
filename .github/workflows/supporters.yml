name: Refresh Armadale supporter data
on:
  schedule:
    # GitHub cron is UTC. Keep the hourly run every day.
    - cron: '23 * * * *'
    # Extra Sunday runs in Perth (AWST / UTC+8), at :08, :38 and :53.
    # Together with :23 above, this gives one run every 15 minutes.
    - cron: '8,38,53 16-23 * * 6'
    - cron: '8,38,53 0-15 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supporters.mjs', 'supporters-core.mjs', 'club-core.mjs', '.github/workflows/supporters.yml']
permissions:
  contents: write
concurrency:
  group: armadale-supporter-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node supporters.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: armadale-supporter-data
          path: reports/supporters.json
          retention-days: 7
      - name: Publish checked public data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/supporters.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh Armadale supporter data'
            git pull --rebase
            git push
          fi
